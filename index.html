<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CPF</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Validador de CPF</h1>
        <button type="button" id="abrir-menu" class="botao-menu">
            ☰
        </button>
    </header>
    <div id="fundo-menu" class="fundo-menu"></div>
    <aside id="menu-lateral" class="menu-lateral">
        <div class="menu-cabecalho">
            <h2>Menu</h2>
            <button type="button" id="fechar-menu">
                ×
            </button>
        </div>
        <nav>
            <a href="https://github.com/Stenio-Moraes" target="_blank">Sobre mim</a>
            <a href="https://github.com/Stenio-Moraes?tab=repositories" target="_blank">Meus reprositorios</a>
            <a href="https://github.com/stars/Stenio-Moraes/lists/projetos-em-destaque" target="_blank">Projetos em destaque</a>
            <a href="https://github.com/Stenio-Moraes" target="_blank">
                GitHub
            </a>
        </nav>
    </aside>
    <main>
        <section>
            <form id="cpf-form" class="card" onsubmit="testarValidacao(event)">
                <label for="cpf">Digite o CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
                    oninput="aplicarMascara(this)" required>
                <button type="submit">Validar</button>
                <div id="resultado"></div>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 - Validador de CPF - Desenvolvido por Stênio Moraes</p>
    </footer>
</body>
<script src="js/script.js"></script>

</html>
